<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details - GitHub Users</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main>
        <button class="back-button" id="back-btn">← Back to Users</button>

        <div id="details-error"></div>

        <div id="user-details-header" class="details-header">
            <!-- Populated by JavaScript -->
        </div>

        <div id="details-loading" class="loading-skeleton">
            <div class="skeleton-card">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-text">
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line short"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-text">
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line short"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-text">
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line short"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-text">
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line short"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-text">
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line short"></div>
                </div>
            </div>
        </div>

        <div class="content-section">
            <h2>Followers (First 5)</h2>
            <div id="followers-container" class="items-grid">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <div class="content-section">
            <h2>Repositories (First 5)</h2>
            <div id="repos-container" class="items-grid">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </main>

    <script type="module" src="./js/details.js"></script>
</body>

</html>
