<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Users</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main>
        <h1>GitHub Users</h1>

        <p id="user-count">Users fetched: 0</p>

        <div id="filter">
            <label for="user-search">Search users:</label>
            <input type="search" id="user-search" placeholder="Search by login" />

            <label for="sort-direction">Sort:</label>
            <select id="sort-direction">
                <option value="asc">A → Z</option>
                <option value="desc">Z → A</option>
            </select>
        </div>

        <p id="filtered-count">Users remaining: 0</p>

        <div id="error-message"></div>

        <div id="loading-skeleton" class="loading-skeleton">
            <div class="skeleton-card">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-text">
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line short"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-text">
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line short"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-text">
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line short"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-text">
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line short"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-text">
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line short"></div>
                </div>
            </div>
        </div>

        <div id="users-container"></div>

        <p><a href="./repositories.html">Search repositories</a></p>
    </main>

    <div id="pagination">
        <button id="previous-btn">Previous</button>
        <span id="page-info"></span>
        <button id="next-btn">Next</button>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
